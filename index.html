<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkyLab: A Junior Astronaut Mission Trainer</title>
<meta name="description" content="SkyLab is a free space-survival game for kids ages 7 to 12. Train like an astronaut: balance power, air, food and radiation using simplified space science.">
<meta name="application-name" content="SkyLab">
<meta name="theme-color" content="#0b1030">
<meta property="og:title" content="SkyLab: A Junior Astronaut Mission Trainer">
<meta property="og:description" content="Balance power, air, food and radiation. Every choice has a cost, just like real astronaut mission planning.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1030'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23ff7a45'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='9' fill='none' stroke='%2355d6ff' stroke-width='4' transform='rotate(-20 32 32)'/%3E%3Ccircle cx='50' cy='22' r='4' fill='%23ffbf47'/%3E%3C/svg%3E">
<style>
:root{--bg:#0b1030;--card:#161d4a;--ink:#f2f4ff;--dim:#a4acd8;--ok:#5be0a0;--bad:#ff6b81;--hot:#ffbf47;--cool:#55d6ff;--sky:#1a2160;--ground:#6d6a7a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
body{min-height:100%;font-size:17px}
main{max-width:860px;margin:0 auto;padding:14px}
h1,h2,h3{margin:0}
p{margin:6px 0;line-height:1.45}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;color:inherit}
button:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
.big{background:var(--hot);color:#2a1a00;font-weight:600;padding:13px 26px;font-size:19px}
.big:hover{filter:brightness(1.1)}
.big:disabled{opacity:.5;cursor:default}
.scene{height:110px;border-radius:18px;overflow:hidden;background:var(--sky);position:relative;transition:background .6s}
.scene svg{width:100%;height:100%;display:block}
.tag{position:absolute;top:8px;right:12px;background:#0007;padding:3px 12px;border-radius:99px;font-size:15px}
.title{position:absolute;top:8px;left:12px;font-weight:600;background:#0007;padding:3px 12px;border-radius:99px;font-size:15px}
.meters{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.m{background:var(--card);border-radius:14px;padding:8px;text-align:center;font-size:14px}
.m b{display:block;font-size:22px}
.track{height:9px;background:#0006;border-radius:9px;overflow:hidden;margin:4px 0}
.track i{display:block;height:100%;transition:width .4s,background .4s}
.d{font-size:13px;min-height:18px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.act{background:var(--card);border-radius:16px;padding:12px;text-align:left;border:2px solid transparent}
.act:hover{border-color:var(--cool)}
.act h3{font-size:18px}
.act small{color:var(--dim);display:block;margin:3px 0 8px;font-size:14px}
.dots{display:flex;gap:6px;align-items:center;min-height:26px}
.dot{width:22px;height:22px;border-radius:50%;background:var(--cool);display:grid;place-items:center;font-size:13px;color:#003}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0;flex-wrap:wrap}
.hint{color:var(--dim);font-size:15px}
.rm{background:#0006;padding:2px 10px;font-size:14px}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
#modal.on{display:flex}
.box{background:var(--card);border-radius:22px;padding:22px;max-width:520px;width:100%;max-height:92vh;overflow:auto}
.opt{display:block;width:100%;text-align:left;background:#0c1238;padding:12px 14px;margin-top:9px;border:2px solid #2c3680}
.opt:hover{border-color:var(--hot)}
.fact{background:#0c1238;border-left:5px solid var(--cool);border-radius:10px;padding:10px 14px;margin-top:12px}
.fact b{color:var(--cool)}
.up{color:var(--ok)}.dn{color:var(--bad)}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:6;background:#000a;padding:6px 12px;font-size:20px}
.panel{background:var(--card);border-radius:18px;padding:14px;margin-bottom:14px}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.gal figure{margin:0;background:#0c1238;border-radius:14px;overflow:hidden}
.gal img{display:block;width:100%;height:auto}
.gal svg,.act svg{display:block;width:100%;height:auto;border-radius:10px}
.gal figcaption{padding:8px 12px 12px;font-size:14px;color:var(--dim)}
.gal b{color:var(--ink);display:block;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:4px 12px;border-radius:99px;background:#0c1238;font-size:14px;color:var(--dim)}
.chip.on{background:var(--hot);color:#2a1a00;font-weight:600}
.chip.done{background:#24406b;color:var(--ink)}
.pb{height:10px;background:#0006;border-radius:9px;overflow:hidden;margin:8px 0}
.pb i{display:block;height:100%;background:var(--hot)}
#xp{position:fixed;inset:0;background:var(--bg);z-index:4;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 24px;display:none}
#xp.on{display:block}
#xp .wrap{max-width:900px;margin:0 auto}
#xp canvas{width:100%;height:auto;display:block;border-radius:16px;background:#05060f;touch-action:none}
.xbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;padding-right:54px}
.sm{padding:8px 16px;font-size:16px;background:#24406b;color:var(--ink)}
.pad{display:flex;gap:10px;justify-content:center;margin-top:10px}
.pad button{background:#24406b;font-size:22px;padding:12px 22px;touch-action:manipulation;user-select:none}
.info{background:var(--card);border-radius:14px;padding:12px 14px;margin-top:10px}
.float{animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px) rotate(2deg)}}
@media(prefers-reduced-motion:reduce){.float{animation:none}}
#stage canvas{width:100%;height:auto;display:block;border-radius:18px;background:#05060f}
#sub{margin:8px 2px 0;font-size:16px;min-height:24px;color:var(--hot)}
@media print{main,#mute,#xp,.noprint{display:none!important}#modal{position:static;background:none;display:block}.box{background:#fff;color:#000;max-height:none}}
@media(max-width:560px){.meters{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main><div id="stage" style="display:none"><canvas id="cv" width="800" height="260" role="img" aria-label="Live view of your outpost and crew"></canvas><div id="sub" aria-live="polite"></div></div><div id="app"></div></main>
<div id="modal"><div class="box" id="box"></div></div>
<div id='xp'></div>
<button id="mute" aria-label="Turn sound on or off">🔊</button>
<script>
const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=v=>Math.max(0,Math.min(100,v));

/* ---------- learning content ---------- */
const FACTS=[
["Moon","A day on the Moon lasts about 29.5 Earth days, so the lunar night is roughly two weeks of darkness. Solar panels make no power then."],
["Mars","A day on Mars is called a sol. It lasts 24 hours and 37 minutes, a bit longer than an Earth day."],
["Radiation","Mars has an atmosphere only about 1% as thick as Earth’s, so it blocks very little space radiation."],
["Radiation","The Moon has no atmosphere and no global magnetic field, so sunlight and cosmic rays hit the surface directly."],
["Shielding","A few meters of rock and soil (regolith) piled on a habitat can cut radiation a lot. Future bases may be buried or covered."],
["Water","Scientists think there is water ice in permanently shadowed craters near the Moon’s poles. That is why bases are planned there."],
["Oxygen","Electrolysis splits water into hydrogen and oxygen. The space station makes most of its oxygen this way."],
["Water","On the space station, sweat, breath moisture and even urine are recycled into drinking water. About 98% of water is recovered on the station."],
["Food","Mars soil contains perchlorates, chemicals that are harmful to people. Farmers would need to wash or treat it first."],
["Food","Astronauts on the space station grew red romaine lettuce in 2015 and ate it. Fresh food helps morale too."],
["Mars","Radio signals take between about 3 and 22 minutes to travel one way between Earth and Mars, so a Mars crew can’t chat in real time."],
["Gravity","Mars has about 38% of Earth’s gravity, and the Moon about 17%. Long stays can weaken muscles and bones."],
["Power","Mars is farther from the Sun, so solar panels there get less than half the sunlight they would on Earth."],
["Mars","Dust storms on Mars can wrap the whole planet for weeks. One storm in 2018 ended the Opportunity rover’s mission."],
["Power","Engineers have tested small nuclear reactors for the surface of the Moon and Mars. They make steady power through night and storms."],
["Moon","Moon dust is sharp, sticky and gets everywhere. Apollo astronauts found it scratched their gear and irritated their lungs."],
["Radiation","On the space station, astronauts receive many times more radiation per day than people on the ground."],
["Radiation","A solar flare’s fast particles can arrive within minutes to hours. Crews would shelter in the most shielded room."],
["Safety","Tiny space rocks (micrometeoroids) move at tens of thousands of km/h. Spacecraft use layered ‘Whipple’ shields to break them up."],
["Crew","Isolation tests like HI-SEAS and Mars-500 showed that hobbies, calls home and good teamwork matter as much as machines."],
["Oxygen","Earth air is about 21% oxygen and 78% nitrogen. A base needs a mix like this, not just oxygen, to stay safe and healthy."],
["Mars","A trip from Earth to Mars takes roughly 6 to 9 months one way, so supplies and repair skills are vital."],
["Moon","Future Moon missions aim to land people near the south pole, where ice is likely."],
["Power","Batteries store daytime solar power for nighttime, but they are heavy to launch. Every kilogram costs a lot to send to space."],
["Training","Astronauts practice spacewalks underwater in a huge pool, because floating in water feels a bit like weightlessness."],
["Training","Trainers secretly add emergencies to simulations on purpose. Astronauts learn to stay calm, share the problem and fix it as a team."],
["Training","Astronaut candidates train for about two years: spacewalks, robotics, flying jets, survival skills and teamwork."],
["Training","When one space agency picked its 2021 class, over 12,000 people applied and 10 were chosen. Steady practice over years makes the difference."],
["Training","Training centrifuges spin astronauts to feel the strong pushes of launch and return."],
["Training","Astronauts come from many careers: pilots, doctors, engineers, scientists, teachers and builders. Curiosity and teamwork matter most."]
];
let seen=[];try{seen=JSON.parse(localStorage.getItem('oc-seen')||'[]')}catch(e){}
function nextFact(){
  let pool=FACTS.map((f,i)=>i).filter(i=>!seen.includes(i));
  if(!pool.length){seen=[];pool=FACTS.map((f,i)=>i)}
  const i=pick(pool);seen.push(i);
  try{localStorage.setItem('oc-seen',JSON.stringify(seen))}catch(e){}
  G.learned.push(FACTS[i]);return FACTS[i];
}

/* Real data: measured radiation dose on the surface, microsieverts per day. Moon 1369 (Chang'E 4 LND, Zhang et al. 2020, Science Advances), Mars 624 (Curiosity RAD, as cited in IAC 2024 paper), ISS 731. Mars is 3 shield points per sol, the Moon is scaled by the dose ratio. */
const DOSE={moon:1369,mars:624,iss:731};
const PLANETS={
 moon:{name:'The Moon',goal:20,rad:Math.round(3*DOSE.moon/DOSE.mars*10)/10,sky:'#05060f',ground:'#8b8b96',note:'No air, 2-week nights, radiation about 2.2\u00d7 Mars\u2019s.'},
 mars:{name:'Mars',goal:20,rad:3,sky:'#4a2230',ground:'#a4553a',note:'Dust storms, sunlight only 43% of Earth\u2019s, thin air.'}
};
const ACTS={
 air:{ico:'💨',name:'Air Plant',txt:'Makes oxygen. Uses 3 power.'},
 power:{ico:'⚡',name:'Solar Panels',txt:'Makes power. Weak at night or in storms.'},
 farm:{ico:'🥬',name:'Greenhouse',txt:'Grows food. Uses 3 power.'},
 shield:{ico:'🛡️',name:'Radiation Wall',txt:'Piles up soil to block radiation.'}
};
const METERS=[['o2','💨','Oxygen'],['pow','⚡','Power'],['food','🥬','Food'],['shield','🛡️','Shield'],['hp','❤️','Crew']];

const EVENTS=[
{id:'flare',t:'☀️ Solar flare warning!',d:'The Sun just threw out a burst of radiation. It is heading your way.',o:[
 ['Shelter the crew in the shielded core',{pow:-5},'Everyone is safe, but you lost some work time.'],
 ['Keep working outside',{hp:-25,shield:-5},'The crew got a big dose of radiation. Ouch.']]},
{id:'meteor',t:'☄️ Micrometeorite hit!',d:'A tiny space rock punched a hole in the wall. Air is hissing out.',o:[
 ['Patch it right now',{o2:-5,pow:-4},'Quick fix! Only a little air was lost.'],
 ['Finish your chores first',{o2:-22},'A lot of air leaked away before you patched it.']]},
{id:'storm',t:'🌪️ Dust storm approaching!',d:'A huge dust cloud will block the Sun for 3 sols.',planet:'mars',o:[
 ['Fold the solar panels to protect them',{storm:3},'Panels are safe. Power will be low until the storm ends.'],
 ['Leave the panels out',{storm:3,pow:-18},'Dust damaged the panels. Power is low.']]},
{id:'dust',t:'🌑 Moon dust on the panels',d:'Sharp lunar dust is covering your solar panels.',planet:'moon',o:[
 ['Brush them clean',{hp:-3,pow:10},'Clean panels collect more sunlight.'],
 ['Ignore it',{pow:-8},'Dusty panels make less power.']]},
{id:'blight',t:'🦠 Plant disease!',d:'Some of your crops are turning brown.',o:[
 ['Replant with spare seeds',{food:-8},'You lost some food but saved the garden.'],
 ['Eat the sick plants anyway',{hp:-15},'The crew got sick. Never eat plants you are unsure about.']]},
{id:'ice',t:'🧊 You found ice!',d:'The rover found water ice under the soil.',o:[
 ['Melt it and make oxygen',{o2:15,pow:-5},'Water was split into oxygen and hydrogen.'],
 ['Use the water for the greenhouse',{food:12,pow:-5},'Plants love fresh water.']]},
{id:'home',t:'💔 Crew feels homesick',d:'It is hard being so far from family.',o:[
 ['Call home on the radio',{hp:10,pow:-3},'A friendly voice helps. Morale is up.'],
 ['Tell them to keep working',{hp:-8},'The crew feels worse. Mental health matters in space.']]},
{id:'fail',t:'🔧 Machine breakdown',d:'A pump stopped working in the main room.',o:[
 ['Repair it using spare parts',{pow:-8},'It works again. Spare parts are precious.'],
 ['Switch to the backup system',{food:-5,o2:-5},'The backup works, but not as well.']]},
{id:'fire',t:'🔥 Smoke alarm!',d:'Smoke is rising in the kitchen module. Act by the checklist.',o:[
 ['Sound the alarm, cut power to the module and use the extinguisher',{pow:-6},'Fire out. Real crews: alert, isolate, extinguish, then check the air.'],
 ['Finish cooking, check it later',{o2:-15,hp:-12},'The smoke spread fast. Never delay a fire response.']]},
{id:'co2',t:'😵 Headaches in the crew',d:'Carbon dioxide is building up. The crew feels sleepy and has headaches.',o:[
 ['Swap the CO₂ scrubber cartridge and rest',{pow:-3,hp:4},'CO₂ is back to normal. Good catch on the early signs.'],
 ['Push through, we have a deadline',{hp:-16,o2:-6},'Tired, sick crews make bad decisions. Health comes first.']]},
{id:'delay',t:'📡 Earth’s advice is late',d:'Mission Control sent instructions 14 minutes ago. Your sensors now show a different problem in the water pump.',planet:'mars',o:[
 ['Trust your sensors, fix it now and report back',{pow:-4},'Right. Mars crews must make safe decisions on their own and keep Earth informed.'],
 ['Wait for Earth to reply',{food:-8,o2:-8},'The delay cost you resources. Autonomy is a key Mars skill.']]}
];

/* ---------- story: four acts, damage that carries over ---------- */
const SYSN={air:'Air Plant',power:'Solar Panels',farm:'Greenhouse',shield:'Radiation Wall'};
const STORY={
 moon:{i:['Act 1: Touchdown','Your crew of 4 lands near the Moon’s south pole. Mission Control has one job for you: stay alive for 20 sols until the supply ship arrives. Build a safe base before the long night.'],
  b:{5:['Act 2: Cracks','A tiny rock punched through the Air Plant wall in the dark. It still runs, but badly.','air'],
     10:['Act 3: The Long Dark','Sticky Moon dust covers the solar panels. Power is falling and trouble is stacking up.','power'],
     15:['Act 4: Last Push','A moonquake knocked over the Radiation Wall. Five sols to go. Hold on!','shield']},
  e:'The supply ship’s lights glow in the black sky. Your crew made it, and your base is the first of many.'},
 mars:{i:['Act 1: Red Dawn','Your crew of 4 lands on Mars. Earth is far away, so you decide for yourselves. Stay alive for 20 sols until the supply ship arrives.'],
  b:{5:['Act 2: Dust','Fine red dust clogs the Greenhouse fans. The plants are struggling.','farm'],
     10:['Act 3: The Great Storm','A giant dust storm hides the Sun, and wind cracked a solar panel. Things get worse before they get better.','power',3],
     15:['Act 4: Last Push','A cracked pipe is leaking air from the Air Plant. Five sols to go. Hold on!','air']},
  e:'A bright dot streaks across the pink sky: your supply ship. Your crew made it, and your outpost lives on.'}};
const actNo=()=>Math.min(4,Math.ceil(G.sol/5));
function storyBeat(){const b=STORY[G.p].b[G.sol];if(!b)return '';G.dmg[b[2]]=1;if(b[3])G.storm=b[3];
  return `<b>${b[0]}.</b> ${b[1]}<br>🔧 <b>${SYSN[b[2]]} is damaged.</b> Your first crew hour there repairs it. Until then it hurts you.`}
/* ---------- game state ---------- */
let G;
function start(p,daily){
  G={p,sol:1,m:{o2:70,pow:70,food:70,shield:60,hp:100},pts:{air:0,power:0,farm:0,shield:0},left:3,storm:0,learned:[],log:[],minO2:100,good:0,evs:0,off:p==='moon'?moonNow().off:0,dmg:{air:0,power:0,farm:0,shield:0}};
  if(daily){G.daily=1;daily.mod.set(G)}
  G.left=G.act||3;
  render();modal(`<h2>${STORY[p].i[0]}</h2><p>${STORY[p].i[1]}</p><p style="text-align:center"><button class="big" id="go0">Begin</button></p>`);$('#go0').onclick=close;
}
const isNight=()=>G.p==='moon'&&((G.sol-1+(G.off||0))%12)>=8;
/* Real data: Mars fact sheet. Solar irradiance Mars 586.2 W/m2, Earth 1361.0 W/m2 (ratio 0.431). The Moon is about as far from the Sun as Earth, so its ratio is 1. */
const SUN_MARS=586.2/1361.0;
function sun(){return (isNight()?0.15:G.storm>0?0.4:1)*(G.p==='mars'?SUN_MARS:1)}
function sim(m,pts){
  const P=PLANETS[G.p],r={...m},d=G.dmg||{},raw=pts;pts={...pts};
  for(const k in d)if(d[k]&&pts[k]>0)pts[k]--;
  const hurt=k=>d[k]&&!raw[k]?1:0;
  r.o2=m.o2+pts.air*11-8-hurt('air')*8;
  r.food=m.food+pts.farm*10-6-hurt('farm')*8;
  const gen=6+Math.round(pts.power*14*sun())-hurt('power')*7;
  const use=8+pts.air*3+pts.farm*3;
  r.pow=m.pow+gen-use;
  r.shield=m.shield+pts.shield*8-P.rad-(G.radx||0)-hurt('shield')*8;
  let blackout=false;
  if(r.pow<0){r.pow=0;blackout=true;r.o2-=10}
  r.hp=m.hp+(r.shield<25?-8:0)+(r.o2<20?-6:0)+(r.food<20?-6:0);
  if(r.shield>=25&&r.o2>=20&&r.food>=20)r.hp+=3;
  for(const k in r)r[k]=clamp(r[k]);
  r.blackout=blackout;return r;
}

/* ---------- screens ---------- */
function intro(){$('#stage').style.display='none';return intro2();
  $('#app').innerHTML=`<div style="text-align:center;padding:10px 0">
  <h1 style="font-size:clamp(32px,7vw,56px)">🚀 SkyLab</h1>
  <p class="hint">Space Survival Lab</p></div>
  <div class="box" style="margin:0 auto 14px">
  <h2>Your mission</h2>
  <p>You lead a crew of 4 on a new base. Keep them alive for <b>20 sols</b> (days). Learn something new about space every sol!</p>
  <p><b>How to play</b></p>
  <p>1️⃣ You have <b>3 crew hours</b> each sol. Tap a job to give it an hour.<br>
  2️⃣ Watch the little <span class="up">+</span> and <span class="dn">−</span> numbers. They show what will happen tomorrow.<br>
  3️⃣ Press <b>Next sol</b>. Surprises will happen, so choose wisely!</p>
  <p class="hint">If oxygen, food or crew health hit zero, the mission fails.</p></div>
  <div class="acts" style="max-width:520px;margin:0 auto">
  ${Object.entries(PLANETS).map(([k,v])=>`<button class="act" data-p="${k}"><h3>${k=='moon'?'🌙':'🔴'} ${v.name}</h3><small>${v.note}</small><b style="color:var(--hot)">Start mission</b></button>`).join('')}
  </div>
  <p class="hint" style="text-align:center;margin-top:14px">Facts learned so far: ${seen.length} of ${FACTS.length}</p>`;
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{sfx('tap');start(b.dataset.p)});
}
function leave(){modal(`<h2>Leave this mission?</h2><p>Your progress on this mission will be lost.</p><p style="text-align:center"><button class="big" id="ly">Leave</button> <button class="big" id="ln" style="background:var(--cool)">Keep playing</button></p>`);
  $('#ly').onclick=()=>{close();DAY=null;intro()};$('#ln').onclick=close}
function sceneSVG(){
  const P=PLANETS[G.p],night=isNight(),storm=G.storm>0;
  const sky=night?'#02030a':storm?'#7a4a3a':P.sky;
  return `<div class="scene" style="background:${sky}">
  <svg viewBox="0 0 400 110" preserveAspectRatio="xMidYMax slice">
   ${night?'':`<circle cx="330" cy="30" r="${G.p=='mars'?9:14}" fill="#ffe28a"/>`}
   ${[[40,20],[90,50],[150,15],[220,40],[280,18],[370,60]].map(s=>`<circle cx="${s[0]}" cy="${s[1]}" r="1.2" fill="#fff" opacity="${night||G.p=='moon'?1:.4}"/>`).join('')}
   ${storm?'<rect width="400" height="110" fill="#d08a5a" opacity=".35"/>':''}
   <path d="M0 90 Q100 78 200 88 T400 84 V110 H0Z" fill="${P.ground}"/>
   <path d="M120 92 A45 45 0 0 1 210 92Z" fill="#dfe6ff" opacity=".8"/>
   <rect x="215" y="76" width="34" height="16" rx="3" fill="#aab4e0"/>
   <rect x="255" y="70" width="28" height="3" fill="${night?'#333':'#4aa0ff'}"/><rect x="255" y="76" width="28" height="3" fill="${night?'#333':'#4aa0ff'}"/>
   <circle cx="165" cy="80" r="4" fill="#ffd54a"/>
  </svg>
  <span class="title">${PLANETS[G.p].name}</span>
  <span class="tag">Sol ${G.sol} of ${P.goal} ${night?'🌑 Night':storm?'🌪️ Storm':'☀️ Day'}</span></div>`;
}

function actTxt(k,a){
  if(k==='power'&&G.p==='mars')return 'Makes power. Real Mars sunlight is only 43% of Earth\u2019s, so panels make less.';
  if(k==='shield')return 'Piles up soil to block radiation. Real dose here: '+DOSE[G.p]+' \u00b5Sv/day.';
  return a.txt}
function dataPanel(){

    modal(`<h2>🎓 Quiz score: ${score} of 3</h2><p class="up">+${score*25} XP · Rank: ${rankOf(XP).n}</p><p>${score==3?'Perfect! You are ready for a real mission.':score>=1?'Nice work, cadet! Play again to learn even more facts.':'Good try! Every astronaut learns by practice.'}</p><p style="text-align:center"><button class="big" id="again2">Play again</button></p>`);

  const ask=()=>{const q=Q[i],op=sh(q.o);open=true;t0=performance.now();
    $('#dc').innerHTML=`<p class='hint'>Scenario ${i+1} of 5 · Skill: ${q.k}</p><h3>${q.t}</h3><p>${q.c}</p><div class='pb'><i id='tb' style='width:100%'></i></div>`+op.map((o,j)=>`<button class='opt' data-j='${j}'>${o[0]}</button>`).join('');
    document.querySelectorAll('#dc .opt').forEach(b=>b.onclick=()=>ans(q,op[b.dataset.j]))};
  const ans=(q,o)=>{if(!open)return;open=false;const s=o?o[1]:0;pts+=s;(sk[q.k]=sk[q.k]||[]).push(s);sfx(s==2?'chime':'tap');
    const best=q.o.find(x=>x[1]==2);
    $('#dc').innerHTML=`<h3>${s==2?'✅ Strong decision':s==1?'🟡 Okay, but not the best':'❌ Risky decision'}</h3><p>${o?o[2]:'⏰ Time ran out. In an emergency, stop, assess, call it out and act.'}</p>${s<2?`<div class='fact'><b>Best move</b><p>${best[0]}. ${best[2]}</p></div>`:''}<p style='text-align:center'><button class='big' id='nx'>${i<4?'Next scenario':'See my report'}</button></p>`;
    $('#nx').onclick=()=>{i++;i<5?ask():done()}};
  const done=()=>{const ok=pts>=8;if(ok)mk('decide');const x=gain(pts*6+(ok?20:0));if(pts>DR){DR=pts;try{localStorage.setItem('oc-dr',DR)}catch(e){}}
    const weak=Object.keys(sk).filter(k=>sk[k].some(v=>v<2));sfx(ok?'win':'chime');
    $('#dc').innerHTML=`<h2>📋 Decision report: ${pts} of 10</h2><p class='up'>${x}</p><p><b>${pts>=8?'Mission ready! Calm, clear decisions.':pts>=5?'Good progress, cadet. Train a little more.':'Keep practicing. Simulators are where astronauts learn.'}</b></p><p>${weak.length?'Practice next: <b>'+weak.join(', ')+'</b>':'All five skills were strong.'}</p><p class='hint'>Best score: ${DR}/10. Real astronauts use a simple routine: <b>Stop · Assess · Communicate · Act · Review</b>.</p><p style='text-align:center'><button class='big' id='ag'>Train again</button></p>`;
    $('#ag').onclick=xDecide;chainEnd(pts)};
  run(t=>{if(!open)return;const p=1-(t-t0)/25000,b=$('#tb');if(b)b.style.width=Math.max(0,p*100)+'%';if(p<=0)ans(Q[i],null)});
  ask()});
}

/* ---- 9. Apollo 13 replay (real event) ---- */
const AP=[
{h:'💥 A bang in space',c:'It is April 13, 1970. Apollo 13 is about 330,000 km from Earth, heading for the Moon. Astronaut Jack Swigert reports a bang. Then Jim Lovell says, “Houston, we’ve had a problem.” An oxygen tank has burst. Power and oxygen in the main ship, Odyssey, are dropping fast. You are in Mission Control. What do you do?',
 o:[['Move the crew into the Lunar Module, Aquarius, and use it as a lifeboat',[-5,0,0],2,'Yes! Aquarius was built to land on the Moon, but it had its own air, power and water.'],
    ['Spend hours trying to restart the damaged fuel cells first',[-30,-10,0],1,'The team did try, but the oxygen was gone. Every minute spent here used up precious supplies.'],
    ['Wait a few hours and watch the numbers',[-35,-20,-10],0,'Waiting wastes the most valuable thing in an emergency: time.']],
 r:'Real result: the crew moved into Aquarius. It was made for 2 people for about 2 days, and it had to keep 3 people alive for about 4 days.'},
{h:'🧭 Which way home?',c:'The ship is still flying away from Earth. If nothing changes, it will swing around the Moon on a path that is too slow and too far from home. The main engine might be damaged. How do you get the crew home?',
 o:[['Use the Lunar Module’s landing engine for burns that put the ship on a path to Earth',[0,-5,-5],2,'Correct! A burn about 5 hours after the bang set the path, and a second burn after the Moon swing saved close to 10 hours.'],
    ['Do nothing for now and swing around the Moon first',[0,-20,-20],1,'The Moon’s gravity helps, but a slow trip means more air and water used.'],
    ['Fire the possibly damaged main engine to turn back right away',[-25,-10,0],0,'Too risky. If that engine was damaged, it could have destroyed the ship.']],
 r:'Real result: the crew used the Lunar Module’s descent engine, an engine built for landing, to speed up the trip home.'},
{h:'⚡ Save the batteries',c:'Odyssey’s batteries are the only power the crew will have for landing in Earth’s ocean. Aquarius has limited power too. Everything uses electricity: computers, lights, heaters and radios.',
 o:[['Turn off everything that is not needed to stay alive, and keep Odyssey’s batteries for landing',[-5,0,0],2,'Yes! The crew cut Aquarius’s power use way down and shut Odyssey off completely.'],
    ['Leave the heaters and computer on just in case',[-25,0,-10],1,'Safer for comfort, not for power. You will need those batteries later.'],
    ['Keep all systems running so the crew stays comfortable',[-45,-10,-10],0,'Comfort now could cost the whole mission later.']],
 r:'Real result: the crew switched off almost everything. The cabin got cold and dark, but the power lasted.'},
{h:'💨 Square peg, round hole',c:'Carbon dioxide (CO₂) from the crew’s breathing is building up in Aquarius. Its filters are full. Odyssey has spare filters, but they are square, and Aquarius needs round ones. The crew has bags, tape, cardboard and hoses.',
 o:[['Engineers on the ground build a test adapter from only what is on board, then talk the crew through it step by step',[0,0,0],2,'Perfect! Test it on the ground first, then guide the crew with clear steps.'],
    ['Tell the crew to figure something out on their own',[0,-25,0],1,'Smart crews can improvise, but this needed careful testing. Time ran short.'],
    ['Open a hatch for fresh air',[0,-45,0],0,'There is no air outside in space. Opening a hatch would lose precious air.']],
 r:'Real result: the ground team built an adapter from a plastic bag, cardboard, a suit hose and duct tape. It worked.'},
{h:'🥶 Cold and thirsty',c:'Aquarius is getting very cold, near 3°C. Water is also needed to cool the electronics. The crew must make drinking water last for days.',
 o:[['Ration water strictly, dress warmly and keep the cooling water for the equipment',[0,0,-5],2,'Yes. It was hard, but careful rationing kept the crew and equipment going.'],
    ['Ration water but run the heaters often',[-10,0,-5],1,'The crew would feel warmer, but heaters use power you cannot spare.'],
    ['Use plenty of water now to feel better, and fix it later',[-15,0,-40],0,'Water was one of the three things they could not run out of.']],
 r:'Real result: each astronaut got only about 180 ml (6 ounces) of water a day. They were cold, tired and thirsty, but they stayed safe.'},
{h:'🔥 Wake up the cold ship',c:'Almost home! The crew must power Odyssey back on and re-enter Earth’s air. But it has been cold and dead for days, and a power-up like this was never planned. The batteries must last until splashdown.',
 o:[['Test a new, low-power startup in the simulators first, then read it to the crew step by step',[-5,0,0],2,'Yes! Real controllers and astronauts worked it out in simulators before trying it in space.'],
    ['Send general instructions and let the crew work out the details',[-20,0,0],1,'Possible, but a mistake could drain the batteries.'],
    ['Skip the testing and switch everything on at once',[-60,0,0],0,'Turning on everything at once could drain the batteries before landing.']],
 r:'Real result: the crew dropped the damaged service module and saw a whole side panel blown off. Then they powered up Odyssey and headed for the ocean.'}];
function xApollo(){
  openXP('🚨 Apollo 13 Replay',`<div class='panel' id='ap' style='margin-top:10px'></div>`,()=>{
  let i=-1,pts=0,M={pw:100,air:100,wa:100};
  const bar=()=>`<div class='chips' style='margin:0 0 10px'>${[['pw','⚡ Power'],['air','💨 Air'],['wa','💧 Water']].map(k=>`<span class='chip ${M[k[0]]>=30?'on':''}' ${M[k[0]]<30?'style="color:#ff8a8a"':''}>${k[1]} ${M[k[0]]}</span>`).join('')}</div>`;
  const intro=()=>{$('#ap').innerHTML=`<h2>April 1970: Apollo 13</h2><p>This really happened. Three astronauts, Jim Lovell, Jack Swigert and Fred Haise, were on their way to the Moon when something went wrong. You will play a member of Mission Control. Each choice costs or saves <b>power, air and water</b>. Keep all three above zero until the crew splashes down.</p><p class='hint'>Based on the real mission record. Some details are simplified.</p><p style='text-align:center'><button class='big' id='go'>Begin 🚨</button></p>`;$('#go').onclick=next};
  const next=()=>{i++;if(i>=AP.length)return fin();const q=AP[i],op=sh(q.o);
    $('#ap').innerHTML=bar()+`<p class='hint'>Crisis ${i+1} of ${AP.length}</p><h3>${q.h}</h3><p>${q.c}</p>`+op.map((o,j)=>`<button class='opt' data-j='${j}'>${o[0]}</button>`).join('');
    document.querySelectorAll('#ap .opt').forEach(b=>b.onclick=()=>ans(q,op[b.dataset.j]))};
  const ans=(q,o)=>{pts+=o[2];M.pw=clamp(M.pw+o[1][0]);M.air=clamp(M.air+o[1][1]);M.wa=clamp(M.wa+o[1][2]);sfx(o[2]==2?'chime':'tap');
    const lost=M.pw<=0||M.air<=0||M.wa<=0;
    $('#ap').innerHTML=bar()+`<h3>${o[2]==2?'✅ Strong call':o[2]==1?'🟡 Okay, but risky':'❌ Dangerous call'}</h3><p>${o[3]}</p><div class='fact'><b>What really happened</b><p>${q.r}</p></div><p style='text-align:center'><button class='big' id='nx'>${lost?'See what happened':i<AP.length-1?'Next crisis':'Re-entry'}</button></p>`;
    $('#nx').onclick=lost?()=>fin(true):next};
  const fin=lost=>{const ok=!lost;if(ok)mk('apollo');const x=gain(pts*8+(ok?40:0));sfx(ok?'win':'fail');
    $('#ap').innerHTML=bar()+(ok?`<h2>🌊 Splashdown!</h2><p class='up'>${x}</p><p>Your team brought the crew home. Score: <b>${pts} of 12</b>.</p>`:`<h2>📉 Supplies ran out</h2><p class='up'>${x}</p><p>One of the three ran out before splashdown. Score: <b>${pts} of 12</b>. In real life the team found a way. Try again with a different plan.</p>`)+
    `<div class='fact'><b>The real ending</b><p>Odyssey splashed down in the South Pacific on April 17, 1970. All three astronauts were safe. It was called a “successful failure”: the Moon landing was lost, but teamwork, checklists and calm thinking saved the crew.</p></div><p class='hint'>Priority ladder: crew safety first, then the ship, then the mission.</p><p style='text-align:center'><button class='big' id='ag'>Replay</button></p>`;
    $('#ag').onclick=xApollo;chainEnd(pts)};
  intro()});
}
/* ---- Mission Control: triage + command decisions + Apollo 13 in one shift ---- */
let CH=null;
const CHP=[['Triage',xTriage,4,'🎛️ Triage'],['Command decisions',xDecide,10,'🧭 Command decisions'],['Apollo 13',xApollo,12,'🚨 Apollo 13 emergency']];
function xControl(){CH={i:0,r:[]};ctrlRun()}
function ctrlRun(){CHP[CH.i][1]();const h=$('#xp h2');if(h)h.textContent='🎛️ Mission Control · Part '+(CH.i+1)+' of 3: '+CHP[CH.i][0]}
function chainEnd(pts){if(!CH)return;CH.r[CH.i]=pts;const b=$('#ag'),last=CH.i>=CHP.length-1;if(!b)return;
  b.textContent=last?'See my shift report ▶':'Next: '+CHP[CH.i+1][0]+' ▶';b.onclick=()=>{CH.i++;last?ctrlDone():ctrlRun()}}
function ctrlDone(){const r=CH.r,tot=r.reduce((a,b)=>a+b,0),max=CHP.reduce((a,b)=>a+b[2],0),pct=Math.round(tot/max*100);
  openXP('🎛️ Mission Control · Shift report',`<div class='panel' style='margin-top:10px'><h2>${pct>=80?'🏆 Flight Director level!':pct>=55?'👍 Solid controller':'📚 Keep training'}</h2><p class='up'>${tot} of ${max} points · ${pct}%</p>`+CHP.map((q,i)=>`<div class='fact'><b>${q[3]}</b><p>${r[i]} of ${q[2]}</p></div>`).join('')+`<p class='hint'>Priority ladder: crew safety first, then the ship, then the mission.</p><p style='text-align:center'><button class='big' id='ag'>Run another shift</button></p></div>`,()=>{});
  $('#ag').onclick=xControl;CH=null}

const PK=[
['💨','Air plant',25,'air',1,'Makes breathable oxygen from water. Without it the crew cannot breathe.'],
['⚡','Solar panels',20,'power',1,'Power runs the air plant, greenhouse and radio. No power means no life support.'],
['🌱','Seeds and grow lights',15,'food',1,'Fresh food on long stays. A supply ship may be late, so a garden is a safety net.'],
['💧','Water recycler',15,'water',1,'Recycles sweat, breath and used water. Every liter you do not have to launch saves weight.'],
['🛡️','Shield bags and shovels',10,'shield',1,'Lets the crew pile soil on the base to block radiation.'],
['🩺','Medical kit',8,'medical',1,'Treats injuries and illness when help is months away.'],
['🔧','Spare parts',12,'spare',0,'Something will break. Repair skills and spares are vital far from home.'],
['📡','Radio antenna',8,'comms',0,'Keeps the crew in touch with Earth, even if messages take minutes.'],
['🎲','Board games',4,'morale',0,'Small and light. Good morale keeps a crew working well together.'],
['🔬','Science kit',10,'sci',0,'Great for discoveries, but the crew must survive first.'],
['🍫','Extra snacks',6,'snack',0,'Tasty, but the garden and food stores come first.'],
['📸','Fancy camera',5,'cam',0,'Nice for photos, but not needed to stay alive.'],
['🚙','Second rover',30,'rover',0,'Very useful, but far too heavy for this ship. Every kilogram costs a lot to launch.']];
function xPack(){
  openXP('📦 Pack the Cargo',`<div class='info'><b>Your ship can carry only 120 kg.</b> Choose what to bring to a new outpost for 4 crew. Think: what keeps people alive first, then what helps the mission? <span class='hint'>Every kilogram is expensive to launch.</span></div><div class='panel' id='pk' style='margin-top:10px'></div>`,()=>{
  const MAX=120,order=sh(PK.map((x,i)=>i)),on=new Set();let note="Tap an item to add it. Tap again to take it out.";
  const wt=()=>[...on].reduce((a,i)=>a+PK[i][2],0);
  const draw=()=>{const w=wt();
    $('#pk').innerHTML=`<b>Cargo: ${w} of ${MAX} kg</b><div class='pb'><i style='width:${Math.min(100,w/MAX*100)}%;background:${w>MAX*.9?'var(--bad)':'var(--hot)'}'></i></div>
    <div class='acts'>${order.map(i=>`<button class='act' data-i='${i}' style='${on.has(i)?'border-color:var(--ok)':''}'><h3>${PK[i][0]} ${PK[i][1]}</h3><small>${PK[i][2]} kg${on.has(i)?' · packed':''}</small></button>`).join('')}</div>
    <div class='info'>${note}</div><p style='text-align:center'><button class='big' id='pl'>Launch 🚀</button></p>`;
    document.querySelectorAll('#pk [data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
      if(on.has(i)){on.delete(i);sfx('rm');note=`<b>${PK[i][0]} ${PK[i][1]}</b> unpacked.`}
      else if(w+PK[i][2]>MAX){tone(200,.25,'sawtooth',.1,0,120);note=`<b class='dn'>Too heavy!</b> ${PK[i][1]} needs ${PK[i][2]} kg but you only have ${MAX-w} kg left. Take something out first.`}
      else{on.add(i);sfx('tap');note=`<b>${PK[i][0]} ${PK[i][1]}</b> (${PK[i][2]} kg)<br>${PK[i][5]}`}
      draw()});
    $('#pl').onclick=launch};
  const launch=()=>{
    const crit=PK.map((x,i)=>i).filter(i=>PK[i][4]),miss=crit.filter(i=>!on.has(i)),sp=[...on].some(i=>PK[i][3]==='spare'),cm=[...on].some(i=>PK[i][3]==='comms');
    const stars=miss.length?(on.size?1:0):(sp&&cm?3:2);
    sfx(stars>=2?'win':'fail');const x=stars?xaward('pack',20+stars*10):'';
    $('#pk').innerHTML=`<h2>${'⭐'.repeat(stars)||'☆'} ${stars==3?'Perfect packing!':stars==2?'The crew can survive':'Not ready to launch'}</h2><p>You packed ${wt()} of ${MAX} kg.</p>
    ${miss.length?`<div class='fact'><b>🚨 Missing life-support items</b>${miss.map(i=>`<p>${PK[i][0]} <b>${PK[i][1]}</b>: ${PK[i][5]}</p>`).join('')}</div>`:`<div class='fact'><b>✅ All six life-support items packed</b><p>Air, power, food, water, radiation shield and medicine. These keep people alive.</p></div>`}
    ${miss.length||(sp&&cm)?'':`<div class='fact'><b>💡 For a perfect score</b><p>Also bring spare parts and a radio. Fixing things and staying in touch can decide a mission.</p></div>`}
    <p class='hint'>Real mission planners face the same trade-off: the heavier the ship, the more fuel and money it costs, so every item must earn its place.</p>
    <p style='text-align:center'><button class='big' id='ag'>Pack again</button></p>`;
    $('#ag').onclick=xPack};
  draw()});
}
